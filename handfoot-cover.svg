<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset=".52" stop-color="#f1e9da"/><stop offset="1" stop-color="#d9cdb7"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#94703c"/><stop offset=".35" stop-color="#f5d997"/><stop offset=".65" stop-color="#cca65e"/><stop offset="1" stop-color="#e4c787"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#276990"/><stop offset=".45" stop-color="#8fc9e9"/><stop offset="1" stop-color="#468db5"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#922d30"/><stop offset="1" stop-color="#511b21"/></linearGradient>
    <pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><path d="m0 6 6-6 6 6-6 6Z" stroke="#f2d6a0" stroke-opacity=".3" stroke-width=".7"/><circle cx="6" cy="6" r=".9" fill="#f2d6a0" fill-opacity=".4"/></pattern>
    <filter id="shadow" x="-60%" y="-50%" width="230%" height="240%"><feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#07110d" flood-opacity=".3"/><feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#07110d" flood-opacity=".38"/></filter>
    <filter id="ground"><feGaussianBlur stdDeviation="12"/></filter>
    <path id="heart" d="M0 5C-24-10-23-27-11-27-5-27-1-23 0-19 2-24 6-27 12-27 24-27 24-10 0 5Z"/>
    <path id="spade" d="M0-27C-6-18-22-10-22 0-22 13-7 16-2 5L-7 21H7L2 5C7 16 22 13 22 0 22-10 6-18 0-27Z"/>
    <g id="jewel"><path d="m0-27 6 19 20-2-16 13 7 19L0 11-17 22l7-19-16-13 20 2Z" fill="url(#gold)" stroke="#98763c" stroke-width="1"/><path d="M0-21v29L-12 17l7-15-14-10 16 2Z" fill="#e9ce8d"/></g>
  </defs>
  <ellipse cx="242" cy="276" rx="159" ry="16" fill="#06170d" opacity=".25" filter="url(#ground)"/>
  <!-- A turned card underneath the deal gives the fan real weight. -->
  <g transform="translate(176 65) rotate(-30 65 104)" filter="url(#shadow)">
    <rect x="0" y="4" width="130" height="201" rx="11" fill="#b7a990"/>
    <rect width="130" height="201" rx="11" fill="url(#paper)" stroke="#a8997f"/>
    <rect x="8" y="8" width="114" height="185" rx="6" fill="url(#back)"/>
    <rect x="13" y="13" width="104" height="175" rx="3" fill="url(#weave)" stroke="#d9ba7d" stroke-width=".8"/>
  </g>
  <!-- Gold identifies the joker; its face remains ivory, as in the hand. -->
  <g transform="translate(104 63) rotate(-19 65 104)" filter="url(#shadow)">
    <rect x="0" y="4" width="130" height="201" rx="11" fill="#c5b79d" stroke="#96886f"/>
    <rect width="130" height="201" rx="11" fill="url(#paper)" stroke="#c8bca7"/>
    <path d="M11 1h108a10 10 0 0 1 10 10v1H1v-1A10 10 0 0 1 11 1ZM1 189h128v1a10 10 0 0 1-10 10H11a10 10 0 0 1-10-10Z" fill="url(#gold)"/>
    <g fill="#4d3823" font-family="Georgia,serif" font-weight="700"><text x="12" y="39" font-size="18">JKR</text><text x="13" y="56" font-size="16">★</text></g>
    <use href="#jewel" transform="translate(65 108) scale(1.35)"/>
    <g transform="translate(130 201) rotate(180)" fill="#4d3823" font-family="Georgia,serif" font-weight="700"><text x="12" y="39" font-size="18">JKR</text><text x="13" y="56" font-size="16">★</text></g>
  </g>
  <!-- Blue identifies the deuce. -->
  <g transform="translate(256 64) rotate(19 65 104)" filter="url(#shadow)">
    <rect x="0" y="4" width="130" height="201" rx="11" fill="#c5b79d" stroke="#96886f"/>
    <rect width="130" height="201" rx="11" fill="url(#paper)" stroke="#c8bca7"/>
    <path d="M11 1h108a10 10 0 0 1 10 10v1H1v-1A10 10 0 0 1 11 1ZM1 189h128v1a10 10 0 0 1-10 10H11a10 10 0 0 1-10-10Z" fill="url(#blue)"/>
    <g fill="#232b2c" font-family="Georgia,serif" font-size="30" font-weight="700"><text x="12" y="40">2</text><use href="#spade" transform="translate(21 56) scale(.27)"/><use href="#spade" transform="translate(65 70) scale(.77)"/><use href="#spade" transform="translate(65 139) rotate(180) scale(.77)"/></g>
    <g transform="translate(130 201) rotate(180)" fill="#232b2c" font-family="Georgia,serif" font-size="30" font-weight="700"><text x="12" y="40">2</text><use href="#spade" transform="translate(21 56) scale(.27)"/></g>
  </g>
  <!-- Seven natural hearts: the game, rather than an abstract monogram. -->
  <g transform="translate(180 34) rotate(-4 65 104)" filter="url(#shadow)">
    <rect x="0" y="5" width="130" height="201" rx="11" fill="#bbae95" stroke="#98896f"/>
    <path d="M8 202h114M8 204h114" stroke="#e4d7bd"/>
    <rect width="130" height="201" rx="11" fill="url(#paper)" stroke="#d6cbb6"/>
    <rect x="5" y="5" width="120" height="191" rx="7" stroke="#fffdf5" stroke-opacity=".65"/>
    <g fill="#aa302a" font-family="Georgia,serif" font-size="31" font-weight="700"><text x="12" y="36">7</text><use href="#heart" transform="translate(20 52) scale(.29)"/>
      <use href="#heart" transform="translate(45 59) scale(.49)"/><use href="#heart" transform="translate(86 59) scale(.49)"/>
      <use href="#heart" transform="translate(65.5 84) scale(.49)"/>
      <use href="#heart" transform="translate(45 109) scale(.49)"/><use href="#heart" transform="translate(86 109) scale(.49)"/>
      <use href="#heart" transform="translate(45 143) rotate(180) scale(.49)"/><use href="#heart" transform="translate(86 143) rotate(180) scale(.49)"/>
    </g>
    <g transform="translate(130 201) rotate(180)" fill="#aa302a" font-family="Georgia,serif" font-size="31" font-weight="700"><text x="12" y="36">7</text><use href="#heart" transform="translate(20 52) scale(.29)"/></g>
  </g>
</svg>
